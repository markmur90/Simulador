{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h1 class="mb-4">Gestión de Usuarios</h1>
  <form method="post" class="mb-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear usuario</button>
  </form>
  <table class="table table-bordered">
    <thead>
      <tr><th>Usuario</th><th>Rol</th><th>Activo</th><th></th></tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.groups.first.name if u.groups.all %}}</td>
        <td>{{ u.is_active }}</td>
        <td>
          <a href="{% url 'toggle_user' u.id %}" class="btn btn-sm btn-secondary">Cambiar estado</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
