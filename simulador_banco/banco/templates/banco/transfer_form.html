{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Transferencia</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Iniciar Transferencia</h2>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="debtor_account_id" class="form-label">ID Cuenta Deudora</label>
        <input type="text" class="form-control" id="debtor_account_id" name="debtor_account_id" required>
      </div>
      <div class="mb-3">
        <label for="creditor_account_id" class="form-label">ID Cuenta Acreedora</label>
        <input type="text" class="form-control" id="creditor_account_id" name="creditor_account_id" required>
      </div>
      <div class="mb-3">
        <label for="amount" class="form-label">Monto</label>
        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
      </div>
      <div class="mb-3">
        <label for="iban" class="form-label">IBAN</label>
        <input type="text" class="form-control" id="iban" name="iban" required>
      </div>
      <button type="submit" class="btn btn-primary">Enviar Transferencia</button>
    </form>
  </div>
</body>
</html>
