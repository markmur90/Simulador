{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Confirmar OTP</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2>Confirmación OTP</h2>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="payment_id" value="{{ payment_id }}">
      <div class="mb-3">
        <label for="otp" class="form-label">Código OTP</label>
        <input type="text" class="form-control" id="otp" name="otp" required>
      </div>
      {% if otp %}
        <div class="alert alert-info">
          OTP generado (solo para pruebas): <strong>{{ otp }}</strong>
        </div>
      {% endif %}
      <button type="submit" class="btn btn-success">Confirmar Transferencia</button>
    </form>
  </div>
</body>
</html>
