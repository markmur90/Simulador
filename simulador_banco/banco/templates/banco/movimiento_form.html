{% extends 'base.html' %}
{% block title %}Movimiento{% endblock %}
{% block content %}
<h1 class="mb-4">{{ tipo|capfirst }} para {{ debtor.nombre }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'estado_deudor' debtor.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
