{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultado de la Transferencia</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-3">Transferencia Completada</h2>
    <div class="card">
      <div class="card-body">
        <p><strong>ID de Transferencia:</strong> {{ payment_id }}</p>
        <p><strong>Estado:</strong> {{ status }}</p>
      </div>
    </div>
    <a href="{% url 'enviar_transferencia_form' %}" class="btn btn-secondary mt-4">Realizar otra transferencia</a>
  </div>
</body>
</html>
